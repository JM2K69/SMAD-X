# Documentation site, English version (built into docs/site/en/ after the French one).
# Build: see docs/README.md

[project]
site_name = "SMA-X"
site_url = "https://jm2k69.github.io/SMAD-X/en/"
site_description = "The SMA-X suite: simulate, model and audit Active Directory (SMAD-X) and file access rights (SMAR-X), with engines verified on real systems and graded labs (SMAD-X Studio)."
site_author = "Jérôme Bezet-Torres"
copyright = "Copyright &copy; 2026 Jérôme Bezet-Torres — SMA-X, non-commercial use"
repo_url = "https://github.com/JM2K69/SMAD-X"
repo_name = "JM2K69/SMAD-X"
docs_dir = "en"
site_dir = "site/en"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "SMAD-X" = [
    "smad-x.md",
    "getting-started.md",
    { "Model" = [
      "modeling.md",
      "tiering.md",
      "graph.md",
    ] },
    { "Analyse" = [
      "audit.md",
      "attack-paths.md",
      "before-after.md",
    ] },
  ] },
  { "Labs" = [
    "labs/index.md",
    "labs/catalog.md",
    "labs/create.md",
    "labs/studio.md",
  ] },
  { "SMAR-X" = [
    "smar-x/index.md",
    "smar-x/linux-rights.md",
    "smar-x/security-tab.md",
    "smar-x/shares.md",
    "smar-x/samba.md",
    "smar-x/labs.md",
    "smar-x/windows-rules.md",
    "smar-x/limits.md",
  ] },
  { "Reference" = [
    "export.md",
    "file-format.md",
    "reference/audit-rules.md",
    "reference/shortcuts.md",
    "reference/sources.md",
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.extra]
alternate = [
  { name = "Français", link = "https://jm2k69.github.io/SMAD-X/", lang = "fr" },
  { name = "English", link = "https://jm2k69.github.io/SMAD-X/en/", lang = "en" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/JM2K69/SMAD-X"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
