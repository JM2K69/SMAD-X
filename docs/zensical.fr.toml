# Site de documentation, version française (racine du site).
# La version anglaise (zensical.en.toml) est construite ensuite dans docs/site/en/.
# Construction : voir docs/README.md

[project]
site_name = "SMAD-X"
site_url = "https://jm2k69.github.io/SMAD-X/"
site_description = "Simuler, modéliser et auditer Active Directory : un simulateur pédagogique avec audit ANSSI, chemins d'attaque et exercices corrigés."
site_author = "Jérôme Bezet-Torres"
copyright = "Copyright &copy; 2026 Jérôme Bezet-Torres — SMAD-X, usage non commercial"
repo_url = "https://github.com/JM2K69/SMAD-X"
repo_name = "JM2K69/SMAD-X"
docs_dir = "fr"
site_dir = "site"

nav = [
  { "Accueil" = "index.md" },
  { "Démarrer" = [
    "installation.md",
    "prise-en-main.md",
  ] },
  { "Modéliser" = [
    "modelisation.md",
    "graphe.md",
  ] },
  { "Analyser" = [
    "audit.md",
    "chemins-d-attaque.md",
    "avant-apres.md",
  ] },
  { "Exercices" = [
    "exercices/index.md",
    "exercices/catalogue.md",
    "exercices/creer.md",
  ] },
  { "Référence" = [
    "export.md",
    "format.md",
    "reference/regles-audit.md",
    "reference/raccourcis.md",
    "reference/sources.md",
  ] },
]

[project.theme]
language = "fr"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Passer au thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Passer au thème sombre"

[project.extra]
alternate = [
  { name = "Français", link = "https://jm2k69.github.io/SMAD-X/", lang = "fr" },
  { name = "English", link = "https://jm2k69.github.io/SMAD-X/en/", lang = "en" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/JM2K69/SMAD-X"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
