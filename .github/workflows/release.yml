name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version du tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le numéro de version vit dans Directory.Build.props : le tag vX.Y.Z doit lui correspondre
      - name: Comparer le tag et Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}'
          if ("v$version" -ne $tag) {
            Write-Error "Le tag $tag ne correspond pas à <Version>$version</Version> dans Directory.Build.props."
            exit 1
          }
          Write-Host "Tag $tag = version $version"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/tests.yml

  build:
    name: Build – ${{ matrix.rid }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # SMAD-X et SMAD-X Studio : deux exécutables autonomes (un seul fichier chacun) dans la même archive
      - name: Publish
        shell: pwsh
        run: |
          foreach ($project in 'SMAD-X/SMAD-X.csproj', 'SMAD-X.Studio/SMAD-X.Studio.csproj') {
            dotnet publish $project -c Release -r ${{ matrix.rid }} --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none -p:DebugSymbols=false -o publish/${{ matrix.rid }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Remove PDB files
        shell: pwsh
        run: Get-ChildItem -Path publish/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item -Force

      # La licence Apache 2.0 et celles des composants tiers (polices OFL comprises) accompagnent chaque copie
      - name: Add license files
        shell: pwsh
        run: Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md, SMAD-X.Core/Fonts/OFL.txt -Destination publish/${{ matrix.rid }}

      # Les exe publiés tels qu'ils seront livrés : extraction single-file, runtime, contenu embarqué.
      # osx-x64 est compilé sur un runner Apple Silicon et n'y est pas lancé.
      - name: Smoke test the published executables
        if: matrix.rid != 'osx-x64'
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.rid }}"
          $ext = if ($IsWindows) { '.exe' } else { '' }
          function Invoke-Published([string]$exe, [string[]]$arguments) {
            $path = Join-Path $dir "$exe$ext"
            if (-not $IsWindows) { chmod +x $path }
            # Exe fenêtrés sous Windows : Start-Process attend la fin et rend le code de sortie
            $out = New-TemporaryFile
            $p = Start-Process -FilePath $path -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            Get-Content $out
            if ($p.ExitCode -ne 0) { throw "$exe $($arguments -join ' ') : code $($p.ExitCode)" }
          }
          Invoke-Published 'SMAD-X' @('--self-test')
          Invoke-Published 'SMAD-X.Studio' @('list-recipes')
          Invoke-Published 'SMAD-X.Studio' @('validate', 'SMAD-X.Core/Labs/01-premier-audit.smadx-lab.json')

      - name: Archive sizes
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.rid }} -File | ForEach-Object { "| ${{ matrix.rid }} | $($_.Name) | $([math]::Round($_.Length / 1MB, 1)) Mo |" } |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Zip artifact (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SMAD-X-${{ matrix.rid }}.zip

      - name: Zip artifact (Linux / macOS)
        if: matrix.rid != 'win-x64'
        run: cd publish/${{ matrix.rid }} && zip -r ../../SMAD-X-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMAD-X-${{ matrix.rid }}
          path: SMAD-X-${{ matrix.rid }}.zip

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Trouver le tag précédent (le dernier tag avant celui-ci)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "Pas de tag précédent trouvé, inclusion de tous les commits."
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Tag précédent : $PREV_TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Aucun commit entre les deux releases."
          fi

          # Stocker dans une variable multi-ligne pour GitHub Actions
          {
            echo "PREV_TAG=${PREV_TAG}"
            echo "COMMITS<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SMAD-X ${{ github.ref_name }}"
          body: |
            ## 🚀 SMAD-X ${{ github.ref_name }}

            ### 📋 Changements depuis ${{ steps.changelog.outputs.PREV_TAG || 'le début' }}

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ### Téléchargements / Downloads

            | Plateforme | Fichier |
            |---|---|
            | 🪟 Windows x64       | `SMAD-X-win-x64.zip` |
            | 🐧 Linux x64         | `SMAD-X-linux-x64.zip` |
            | 🍎 macOS x64 (Intel) | `SMAD-X-osx-x64.zip` |
            | 🍎 macOS arm64 (M1–M5) | `SMAD-X-osx-arm64.zip` |

            Chaque archive contient **SMAD-X** (le simulateur) et **SMAD-X Studio** (la création d'exercices pour les formateurs).
            Each archive contains **SMAD-X** (the simulator) and **SMAD-X Studio** (lab authoring for trainers).

            > **macOS** : si nécessaire, exécutez `chmod +x SMAD-X SMAD-X.Studio && xattr -d com.apple.quarantine SMAD-X SMAD-X.Studio`
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
