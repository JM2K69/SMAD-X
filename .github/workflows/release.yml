name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version du tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Le numéro de version vit dans Directory.Build.props : le tag vX.Y.Z doit lui correspondre
      - name: Comparer le tag et Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}'
          if ("v$version" -ne $tag) {
            Write-Error "Le tag $tag ne correspond pas à <Version>$version</Version> dans Directory.Build.props."
            exit 1
          }
          Write-Host "Tag $tag = version $version"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/tests.yml

  build:
    name: Build – ${{ matrix.rid }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Une application par dossier, donc par archive : SMAD-X, SMAD-X Studio et SMAR-X, chacune un exécutable
      # autonome (un seul fichier). Le nom du dossier devient celui de l'archive : SMAD-X-Studio-win-x64.zip.
      - name: Publish
        shell: pwsh
        run: |
          $apps = [ordered]@{
            'SMAD-X'        = 'SMAD-X/SMAD-X.csproj'
            'SMAD-X-Studio' = 'SMAD-X.Studio/SMAD-X.Studio.csproj'
            'SMAR-X'        = 'SMAR-X/SMAR-X.csproj'
          }
          foreach ($app in $apps.GetEnumerator()) {
            dotnet publish $app.Value -c Release -r ${{ matrix.rid }} --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none -p:DebugSymbols=false -o publish/${{ matrix.rid }}/$($app.Key)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Remove PDB files
        shell: pwsh
        run: Get-ChildItem -Path publish/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item -Force

      # La licence Apache 2.0 et celles des composants tiers (polices OFL comprises) accompagnent chaque archive
      - name: Add license files
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem publish/${{ matrix.rid }} -Directory) {
            Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md, SMAD-X.Core/Fonts/OFL.txt -Destination $dir.FullName
          }

      # Les exe publiés tels qu'ils seront livrés : extraction single-file, runtime, contenu embarqué.
      # osx-x64 est compilé sur un runner Apple Silicon et n'y est pas lancé.
      - name: Smoke test the published executables
        if: matrix.rid != 'osx-x64'
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          function Invoke-Published([string]$folder, [string]$exe, [string[]]$arguments) {
            $path = Join-Path "publish/${{ matrix.rid }}/$folder" "$exe$ext"
            if (-not $IsWindows) { chmod +x $path }
            # Exe fenêtrés sous Windows : Start-Process attend la fin et rend le code de sortie
            $out = New-TemporaryFile
            $p = Start-Process -FilePath $path -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
            Get-Content $out
            if ($p.ExitCode -ne 0) { throw "$exe $($arguments -join ' ') : code $($p.ExitCode)" }
          }
          Invoke-Published 'SMAD-X' 'SMAD-X' @('--self-test')
          Invoke-Published 'SMAD-X-Studio' 'SMAD-X.Studio' @('list-recipes')
          Invoke-Published 'SMAD-X-Studio' 'SMAD-X.Studio' @('validate', 'SMAD-X.Core/Labs/01-premier-audit.smadx-lab.json')
          Invoke-Published 'SMAR-X' 'SMAR-X' @('--self-test')

      - name: Archive sizes
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.rid }} -File -Recurse | Where-Object { $_.Extension -notin '.md', '.txt' -and $_.Name -notin 'LICENSE', 'NOTICE' } |
            ForEach-Object { "| ${{ matrix.rid }} | $($_.Directory.Name) | $($_.Name) | $([math]::Round($_.Length / 1MB, 1)) Mo |" } |
            Add-Content $env:GITHUB_STEP_SUMMARY

      # Une archive par application : SMAD-X-<rid>.zip, SMAD-X-Studio-<rid>.zip, SMAR-X-<rid>.zip
      - name: Zip artifacts (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem publish/${{ matrix.rid }} -Directory) {
            Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath "$($dir.Name)-${{ matrix.rid }}.zip"
          }

      # zip garde le bit exécutable des fichiers
      - name: Zip artifacts (Linux / macOS)
        if: matrix.rid != 'win-x64'
        run: |
          for dir in publish/${{ matrix.rid }}/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../../$name-${{ matrix.rid }}.zip" .)
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: "*-${{ matrix.rid }}.zip"
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Trouver le tag précédent (le dernier tag avant celui-ci)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "Pas de tag précédent trouvé, inclusion de tous les commits."
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Tag précédent : $PREV_TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Aucun commit entre les deux releases."
          fi

          # Stocker dans une variable multi-ligne pour GitHub Actions
          {
            echo "PREV_TAG=${PREV_TAG}"
            echo "COMMITS<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SMAD-X ${{ github.ref_name }}"
          body: |
            ## 🚀 SMAD-X ${{ github.ref_name }}

            ### 📋 Changements depuis ${{ steps.changelog.outputs.PREV_TAG || 'le début' }}

            ${{ steps.changelog.outputs.COMMITS }}

            ---

            ### Téléchargements / Downloads

            | Plateforme | SMAD-X | SMAD-X Studio | SMAR-X |
            |---|---|---|---|
            | 🪟 Windows x64       | `SMAD-X-win-x64.zip` | `SMAD-X-Studio-win-x64.zip` | `SMAR-X-win-x64.zip` |
            | 🐧 Linux x64         | `SMAD-X-linux-x64.zip` | `SMAD-X-Studio-linux-x64.zip` | `SMAR-X-linux-x64.zip` |
            | 🍎 macOS x64 (Intel) | `SMAD-X-osx-x64.zip` | `SMAD-X-Studio-osx-x64.zip` | `SMAR-X-osx-x64.zip` |
            | 🍎 macOS arm64 (M1–M5) | `SMAD-X-osx-arm64.zip` | `SMAD-X-Studio-osx-arm64.zip` | `SMAR-X-osx-arm64.zip` |

            Une archive par application, chacune avec un seul exécutable autonome : **SMAD-X** (le simulateur Active Directory), **SMAD-X Studio** (la création d'exercices pour les formateurs), **SMAR-X** (le simulateur des droits d'accès aux fichiers, Linux et Windows).
            One archive per application, each with a single standalone executable: **SMAD-X** (the Active Directory simulator), **SMAD-X Studio** (lab authoring for trainers), **SMAR-X** (the file access rights simulator, Linux and Windows).

            > **macOS** : si nécessaire, dans le dossier décompressé, exécutez `chmod +x SMAD-X && xattr -d com.apple.quarantine SMAD-X` (de même pour `SMAD-X.Studio` et `SMAR-X`)
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
