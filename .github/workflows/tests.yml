name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Les tests d'export exigent PowerShell 7, et Windows PowerShell 5.1 sous Windows
      - name: Check PowerShell 7
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Check Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: powershell -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Test
        run: dotnet test SMAD-X.slnx --configuration Debug
